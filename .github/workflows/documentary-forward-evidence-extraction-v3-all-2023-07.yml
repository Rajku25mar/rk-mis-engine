name: RK-MIS July 2023 All-Prequalified Documentary Extraction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/documentary-forward-evidence-extraction-v3-all-2023-07.yml"

permissions:
  contents: read
  actions: read

jobs:
  documentary-evidence-v3-all:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bootstrap July 2023 all-prequalified documentary extraction')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download frozen metadata probe artifact
        uses: actions/download-artifact@v4
        with:
          name: rk-mis-2023-07-documentary-probe
          path: input/documentary-probe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31793071494

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pypdf>=5.9,<6"

      - name: Compile extraction stage
        run: python -m py_compile scripts/extract_documentary_forward_evidence_candidates.py scripts/run_technical_replay.py

      - name: Extract all prequalified page-level candidates
        run: |
          python scripts/extract_documentary_forward_evidence_candidates.py \
            --candidate-index input/documentary-probe/candidate_index.json \
            --protocol validation/2023-07/documentary_forward_evidence_protocol_v1.json \
            --rubric validation/2023-07/documentary_forward_evidence_rubric_v1.json \
            --triage-lock validation/2023-07/documentary_download_triage_lock_v3_all_prequalified.json \
            --output artifacts/2023-07-documentary-extraction-v3

      - name: Enforce public artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('artifacts/2023-07-documentary-extraction-v3')
          allowed={'report.json','claim_candidates.json'}
          files={p.name for p in root.iterdir() if p.is_file()}
          assert files==allowed, files
          text=(root/'claim_candidates.json').read_text(encoding='utf-8').lower()
          assert 'raw_document_text_included": false' in text
          print('RK_MIS_PUBLIC_ARTIFACT_BOUNDARY=PASS')
          PY

      - name: Show extraction report
        run: cat artifacts/2023-07-documentary-extraction-v3/report.json

      - name: Upload all-prequalified derived artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk-mis-2023-07-documentary-extraction-v3
          path: |
            artifacts/2023-07-documentary-extraction-v3/report.json
            artifacts/2023-07-documentary-extraction-v3/claim_candidates.json
          retention-days: 14
          if-no-files-found: error
