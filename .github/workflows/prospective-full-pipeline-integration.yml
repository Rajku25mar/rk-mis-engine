name: RK-MIS Prospective Full Pipeline Integration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prospective-full-pipeline-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bootstrap prospective full pipeline integration test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create synthetic denominator fixture
        run: |
          mkdir -p /tmp/rk-mis-integration
          cat > /tmp/rk-mis-integration/base.csv <<'CSV'
          symbol,isin,company_name,sector,ttm_revenue_cr
          AIMTRON,INE0RUV01018,Aimtron Electronics Limited,Electronics,100
          ORIANA,INE0OUT01019,Oriana Power Limited,Renewable Energy,100
          TECHD,INE0Y5H01014,TechD Cybersecurity Limited,Cybersecurity,100
          TECHLABS,INE0QD201012,Trident Techlabs Limited,Technology,100
          KPGEL,,KP Green Engineering Limited,Engineering,100
          BONDADA,,Bondada Engineering Limited,Engineering,100
          CFF,,CFF Fluid Control Limited,Defence Engineering,100
          CSV

      - name: Run official engine with reviewed documentary and catalyst ledgers
        run: |
          python scripts/run_rk_mie.py \
            --input /tmp/rk-mis-integration/base.csv \
            --settings config/rk_mie_scoring.json \
            --documentary-ledger \
              validation/prospective_documentary_review_2026-08-15_v1.json \
              validation/prospective_documentary_review_2026-08-15_v2_delta.json \
              validation/prospective_documentary_review_2026-08-15_v3_bse_delta.json \
            --catalyst-ledger validation/prospective_catalyst_review_2026-08-15_v1.json \
            --as-of 2026-08-15 \
            --output /tmp/rk-mis-integration/output

      - name: Enforce integrated evidence behavior
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('/tmp/rk-mis-integration/output')
          with (root/'company_intelligence_with_prospective_evidence.csv').open() as f:
              rows={r['symbol']:r for r in csv.DictReader(f)}
          report=json.loads((root/'prospective_merge_report.json').read_text())
          result=json.loads((root/'rk_mie_latest.json').read_text())

          assert rows['AIMTRON']['reinvestment_runway_score']=='40.0'
          assert rows['ORIANA']['reinvestment_runway_score']=='60.0'
          assert rows['KPGEL']['moat_evidence_score']=='40.0'
          assert rows['TECHLABS']['new_product_export_optionalities_score']=='40.0'
          assert rows['KPGEL']['order_quality_score']=='100.0'
          assert rows['KPGEL']['capex_execution_score']=='45.0'
          assert rows['ORIANA']['orderbook_to_sales']=='68.0'
          assert rows['KPGEL']['orderbook_to_sales']=='18.31'
          assert rows['BONDADA']['orderbook_to_sales']=='100.23'
          assert rows['TECHLABS']['orderbook_to_sales']=='0.35'
          assert rows['CFF']['order_quality_score']=='100.0'
          assert rows['CFF']['orderbook_to_sales']==''
          assert rows['AIMTRON']['order_quality_score']==''
          assert report['conflict_feature_cells']==0
          assert report['catalyst_ledger_load']['order_rows']==6
          assert report['catalyst_ledger_load']['capex_rows']==1
          assert report['orderbook_to_sales_denominator_rule']=='EXPLICIT_TTM_REVENUE_FIELD_ONLY'
          assert len(result['results'])==7
          # This fixture uses synthetic TTM revenue solely to exercise denominator release.
          # Its generated scores are never uploaded or interpreted as research output.
          print('RK_MIS_PROSPECTIVE_FULL_PIPELINE=PASS')
          PY

      - name: Delete synthetic scoring output
        if: always()
        run: rm -rf /tmp/rk-mis-integration
