name: RK-MIS 2021 Smart Money Schema Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-money-schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile schema probe
        run: python -m py_compile scripts/probe_smart_money_shareholding_schema.py scripts/run_promoter_accumulation_replay.py scripts/run_technical_replay.py

      - name: Run frozen pre-outcome schema probe
        run: |
          python scripts/probe_smart_money_shareholding_schema.py \
            --protocol validation/2021/smart_money_schema_probe_v1.json \
            --output artifacts/2021-smart-money-schema

      - name: Enforce schema-only artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/2021-smart-money-schema')
          files={p.name for p in root.iterdir() if p.is_file()}
          assert files=={'report.json'}, files
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          assert report['raw_shareholding_values_published'] is False
          assert report['company_level_holding_values_published'] is False
          assert report['future_outcomes_seen'] is False
          print('RK_MIS_SMART_MONEY_SCHEMA_BOUNDARY=PASS')
          PY

      - name: Show schema report
        run: cat artifacts/2021-smart-money-schema/report.json

      - name: Upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: rk-mis-2021-smart-money-schema-probe
          path: artifacts/2021-smart-money-schema/report.json
          retention-days: 14
          if-no-files-found: error
