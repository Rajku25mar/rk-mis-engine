name: RK-MIS 2023 Objective Core Replay

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/historical-replay-2023-objective-core.yml"

permissions:
  contents: read

jobs:
  replay-2023-objective-core:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bootstrap 2023 objective core replay')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile objective core replay runner
        run: python -m py_compile scripts/run_objective_core_replay.py scripts/run_objective_core_replay_parallel.py scripts/run_technical_replay.py

      - name: Run frozen 2023 objective core replay
        run: |
          python scripts/run_objective_core_replay_parallel.py \
            --protocol validation/2023/objective_core_protocol_v1.json \
            --output artifacts/2023-objective-core

      - name: Enforce public artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('artifacts/2023-objective-core')
          allowed = {'report.json', 'manifest.json'}
          files = {p.name for p in root.iterdir() if p.is_file()}
          assert files == allowed, f'Unexpected public artifacts: {sorted(files)}'
          for p in root.iterdir():
              if p.is_file():
                  assert p.suffix.lower() not in {'.zip', '.pdf', '.xml', '.csv', '.xbrl'}, p
          print('RK_MIS_PUBLIC_ARTIFACT_BOUNDARY=PASS')
          PY

      - name: Show derived replay report
        run: cat artifacts/2023-objective-core/report.json

      - name: Upload safe derived replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk-mis-2023-objective-core-replay
          path: |
            artifacts/2023-objective-core/report.json
            artifacts/2023-objective-core/manifest.json
          retention-days: 14
          if-no-files-found: error
