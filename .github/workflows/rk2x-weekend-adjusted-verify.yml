name: RK2X Weekend Adjusted Verify

on:
  pull_request:
    paths:
      - '.github/workflows/rk2x-weekend-adjusted-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pandas numpy requests yfinance
      - name: Fetch public engine
        run: |
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/Rajku25mar/rk-mis-engine/rk2x-public-backtest-20260821/scripts/rk2x_public_backtest.py -o scripts/rk2x_public_backtest.py
      - name: Adjusted historical verification
        run: |
          python - <<'PY'
          import importlib.util, pandas as pd, yfinance as yf
          from pathlib import Path
          p=Path.cwd()/'scripts'/'rk2x_public_backtest.py'
          spec=importlib.util.spec_from_file_location('rk2x',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.OUT=Path.cwd()/'validation'/'rk2x_weekend_adjusted'; m.OUT.mkdir(parents=True,exist_ok=True)
          m.CANDIDATES={
            'PGEL':'PGEL.NS','GRPLTD':'GRPLTD.NS','POWERINDIA':'POWERINDIA.NS','ANANTRAJ':'ANANTRAJ.NS',
            'BEL':'BEL.NS','NEWGEN':'NEWGEN.NS','GODFRYPHLP':'GODFRYPHLP.NS','KIRLOSBROS':'KIRLOSBROS.NS',
            'INDRAMEDCO':'INDRAMEDCO.NS','SARDAEN':'SARDAEN.NS','GLENMARK':'GLENMARK.NS','CHOICEIN':'CHOICEIN.NS'
          }
          def adj_one(ticker,period='10y'):
              raw=yf.download(ticker,period=period,interval='1d',auto_adjust=True,progress=False,threads=False)
              return m.normalize_ohlcv(raw)
          m.download_one=adj_one
          m.fetch_nse_universe=lambda: pd.DataFrame(columns=['ticker','board','isin'])
          m.fetch_bse_universe=lambda _: pd.DataFrame(columns=['ticker','board','isin'])
          m.main()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rk2x-weekend-adjusted-verify
          path: validation/rk2x_weekend_adjusted/
          retention-days: 14
