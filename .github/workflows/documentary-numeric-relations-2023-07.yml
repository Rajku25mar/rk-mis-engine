name: RK-MIS July 2023 Strict Documentary Numeric Review

# Post-fix bootstrap: strict review rules unchanged; parser commit is CI-green.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/documentary-numeric-relations-2023-07.yml"

permissions:
  contents: read
  actions: read

jobs:
  strict-numeric-relations:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bootstrap July 2023 strict documentary numeric review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download frozen v2 documentary extraction artifact
        uses: actions/download-artifact@v4
        with:
          name: rk-mis-2023-07-documentary-extraction-v2
          path: input/documentary-v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31794298533

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pypdf>=5.9,<6"

      - name: Compile strict numeric extractor
        run: python -m py_compile scripts/extract_documentary_numeric_relations.py scripts/run_technical_replay.py

      - name: Extract strict numeric relations
        run: |
          python scripts/extract_documentary_numeric_relations.py \
            --claim-candidates input/documentary-v2/claim_candidates.json \
            --numeric-lock validation/2023-07/documentary_numeric_review_lock_v1.json \
            --output artifacts/2023-07-documentary-numeric

      - name: Enforce structured-only artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('artifacts/2023-07-documentary-numeric')
          allowed={'report.json','numeric_relations.json'}
          files={p.name for p in root.iterdir() if p.is_file()}
          assert files==allowed, files
          text=(root/'numeric_relations.json').read_text(encoding='utf-8').lower()
          assert 'raw_page_text_included": false' in text
          print('RK_MIS_PUBLIC_ARTIFACT_BOUNDARY=PASS')
          PY

      - name: Show strict numeric report
        run: cat artifacts/2023-07-documentary-numeric/report.json

      - name: Upload structured numeric review artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk-mis-2023-07-documentary-numeric-relations
          path: |
            artifacts/2023-07-documentary-numeric/report.json
            artifacts/2023-07-documentary-numeric/numeric_relations.json
          retention-days: 14
          if-no-files-found: error
