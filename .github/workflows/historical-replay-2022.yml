name: RK-MIS 2022 Technical Replay

# Acquisition compatibility rerun v2: same frozen protocol and scoring rules.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/historical-replay-2022.yml"

permissions:
  contents: read

jobs:
  replay-2022:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bootstrap 2022 technical replay')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile replay runner
        run: python -m py_compile scripts/run_technical_replay.py

      - name: Run frozen 2022 technical replay
        run: |
          python scripts/run_technical_replay.py \
            --anchor 2022-01-31 \
            --lookback-start 2021-02-01 \
            --outcome 2025-01-31 \
            --sample-size 250 \
            --protocol validation/2022/technical_replay_protocol_v1.json \
            --output artifacts/2022-technical

      - name: Enforce public artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('artifacts/2022-technical')
          allowed = {'report.json', 'manifest.json'}
          files = {p.name for p in root.iterdir() if p.is_file()}
          assert files == allowed, f'Unexpected public artifacts: {sorted(files)}'
          for p in root.iterdir():
              if p.is_file():
                  assert p.suffix.lower() not in {'.zip', '.pdf', '.xml', '.csv'}, p
          print('RK_MIS_PUBLIC_ARTIFACT_BOUNDARY=PASS')
          PY

      - name: Show derived replay report
        run: cat artifacts/2022-technical/report.json

      - name: Upload safe derived replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk-mis-2022-technical-replay
          path: |
            artifacts/2022-technical/report.json
            artifacts/2022-technical/manifest.json
          retention-days: 14
          if-no-files-found: error
