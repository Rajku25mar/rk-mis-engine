name: RK-MIS July 2022 Smart Money XBRL Taxonomy Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smart-money-xbrl-schema-probe-2022-07.yml"

permissions:
  contents: read

jobs:
  smart-money-xbrl-schema-probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bootstrap July 2022 smart money XBRL taxonomy probe')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile XBRL taxonomy probe
        run: python -m py_compile scripts/probe_smart_money_xbrl_schema.py scripts/run_promoter_accumulation_replay.py scripts/run_technical_replay.py

      - name: Run frozen July 2022 pre-outcome XBRL taxonomy probe
        run: |
          python scripts/probe_smart_money_xbrl_schema.py \
            --protocol validation/2022-07/smart_money_xbrl_schema_probe_v1.json \
            --output artifacts/2022-07-smart-money-xbrl-schema

      - name: Enforce taxonomy-only artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/2022-07-smart-money-xbrl-schema')
          files={p.name for p in root.iterdir() if p.is_file()}
          assert files=={'report.json'}, files
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          assert report['numeric_holding_values_published'] is False
          assert report['raw_xbrl_published'] is False
          assert report['raw_xbrl_urls_published'] is False
          assert report['future_outcomes_seen'] is False
          print('RK_MIS_2022_07_SMART_MONEY_XBRL_SCHEMA_BOUNDARY=PASS')
          PY

      - name: Show XBRL taxonomy report
        run: cat artifacts/2022-07-smart-money-xbrl-schema/report.json

      - name: Upload XBRL taxonomy report
        uses: actions/upload-artifact@v4
        with:
          name: rk-mis-2022-07-smart-money-xbrl-schema-probe
          path: artifacts/2022-07-smart-money-xbrl-schema/report.json
          retention-days: 14
          if-no-files-found: error
