name: RK-MIS BSE Documentary Metadata Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bse-documentary-metadata-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Bootstrap bounded BSE documentary metadata probe')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile BSE metadata probe
        run: python -m py_compile scripts/probe_bse_documentary_metadata.py
      - name: Probe four BSE shortlist codes only
        run: |
          python scripts/probe_bse_documentary_metadata.py \
            --watchlist config/prospective_documentary_watchlist_v1.json \
            --from-date 2026-04-17 \
            --to-date 2026-08-15 \
            --output artifacts/bse-documentary-probe/report.json
      - name: Enforce metadata-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/bse-documentary-probe/report.json')
          d=json.loads(p.read_text())
          assert d['watchlist_rows']==4
          assert d['raw_announcement_payload_published'] is False
          assert d['raw_attachment_published'] is False
          assert d['future_prices_loaded'] is False
          assert d['automatic_score_created'] is False
          print('RK_MIS_BSE_METADATA_BOUNDARY=PASS')
          PY
      - name: Show metadata probe
        run: cat artifacts/bse-documentary-probe/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: rk-mis-bse-documentary-metadata-probe-2026-08-15
          path: artifacts/bse-documentary-probe/report.json
          retention-days: 7
          if-no-files-found: error
