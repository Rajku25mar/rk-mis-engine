name: RK-MIS Prospective Documentary Discovery

# Bounded shortlist-only prospective evidence capture. This is intentionally not a full-market scraper.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 6"
  push:
    paths:
      - ".github/workflows/prospective-documentary-scan.yml"

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, 'Bootstrap prospective documentary discovery scan')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Resolve rolling evidence window
        run: |
          echo "FROM_DATE=$(date -u -d '120 days ago' +%F)" >> "$GITHUB_ENV"
          echo "TO_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Compile bounded discovery runner
        run: python -m py_compile scripts/discover_prospective_nse_documentary.py

      - name: Run current bounded primary-document discovery
        run: |
          python scripts/discover_prospective_nse_documentary.py \
            --watchlist config/prospective_documentary_watchlist_v1.json \
            --policy validation/prospective_documentary_discovery_v1.json \
            --from-date "$FROM_DATE" \
            --to-date "$TO_DATE" \
            --output artifacts/prospective-documentary

      - name: Enforce candidate-only artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/prospective-documentary')
          files={p.name for p in root.iterdir() if p.is_file()}
          assert files=={'report.json','review_queue.json','document_manifest.json'}, files
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          queue=json.loads((root/'review_queue.json').read_text(encoding='utf-8'))
          assert report['watchlist_symbols'] <= 40
          assert report['automated_candidates_are_scores'] is False
          assert report['review_required_before_scoring'] is True
          assert report['raw_pdf_published'] is False
          assert report['raw_pdf_text_published'] is False
          assert queue['raw_document_text_included'] is False
          assert queue['automatic_score_included'] is False
          assert all(row['review_state']=='PENDING' and row['score_eligible'] is False for row in queue['candidates'])
          print('RK_MIS_PROSPECTIVE_DOCUMENTARY_BOUNDARY=PASS')
          PY

      - name: Show aggregate discovery report
        run: cat artifacts/prospective-documentary/report.json

      - name: Upload review queue only
        uses: actions/upload-artifact@v4
        with:
          name: rk-mis-prospective-documentary-latest
          path: |
            artifacts/prospective-documentary/report.json
            artifacts/prospective-documentary/review_queue.json
            artifacts/prospective-documentary/document_manifest.json
          retention-days: 14
          if-no-files-found: error
